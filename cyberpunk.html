<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cyberpunk 2077 themed login</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #0d0d0d;
                font-family: 'Orbitron', sans-serif;
                color: #fff;
                overflow: hidden;
            }
            body::before {
                content: "";
                position: absolute;
                inset: 0;
                background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 2px, transparent 4px);
                pointer-events: none;
                z-index: 10;
            }

            .cyber-box {
                position: relative;
                width: 380px;
                padding: 40px 30px;
                background: rgba(10, 10, 10, 0.85);
                border: 3px solid #fcee09;
                border-radius: 12px;
                box-shadow: 0 0 20px #fcee09, 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(255, 0, 255, 0.2);
                transform: skewX(-3deg);
            }
            .cyber-box::before {
                content: "";
                position :absolute;
                inset: -3px;
                border: 3px dashed #fcee09;
                filter: drop-shadow(0 0 10px #fcee09);
                animation: glitch 1.5s infinite linear;
                pointer-events: none;
            }

            @keyframes glitch {
                0% { clip-path: inset(0 0 90% 0); }
                25% { clip-path: inset(10% 0 50% 0); }
                50% { clip-path: inset(40% 0 20% 0); }
                75% { clip-path: inset(80% 0 5% 0); }
                100% { clip-path: inset(0 0 90% 0); }    
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
                color: #fcee09;
                text-shadow: 0 0 10px #fcee09, 0 0 25px #00eaff;
                letter-spacing: 2px;
            }

            label {
                font-size: 13px;
                color: #00eaff;
                text-shadow: 0 0 5px #00eaff;
                margin-bottom: 5px;
                display: block;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 20px;
                border: 2px solid #fcee09;
                border-radius: 6px;
                background: #0d0d0d;
                color: #fcee09;
                font-size: 14px;
                outline: none;
                box-shadow: 0 0 10px #fcee09;
            }

            input::placeholder {
                color: #bdb76b;
            }

            button {
                width: 100%;
                padding: 12px;
                border-radius: 6px;
                border: 2px solid #fcee09;
                background: #fcee09;
                color: #fcee09;
                font-weight: bold;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;
                text-transform: uppercase;
                box-shadow: 0 0 16px #fcee09;
            }

            button:hover {
                background: #00eaff;
                color: #000;
                border-color: #00eaff;
                box-shadow: 0 0 20px #00eaff;
                transform: scale(1.05);
            }
            
            .accent {
                position: absolute;
                width: 80px;
                height: 40px;
                background: #fcee09;
                right: -20px;
                top: 20px;
                transform: rotate(35deg);
                box-shadow: 0 0 10px #fcee09;
            }

            .accent2 {
                position: absolute;
                width: 50px;
                height: 4px;
                background: #00eaff;
                left: -15px;
                bottom: 30px;
                transform: rotate(-40deg);
                box-shadow: 0 0 10px #00eaff;
            }
        </style>
    </head>
    <body>
        <div class="cyber-box">
            <div class="accent"></div>
            <div class="accent2"></div>

            <h1>SYSTEM LOGIN</h1>

            <form action="/login" method="post">

                <label for="email">NetRunner ID</label>
                <input type="email" id="email" name="email" placeholder="enter id...." required>

                <label for="password">Access Key</label>
                <input type="password" id="password" name="password" placeholder="enter key..." required>

                <button type="submit">Connect</button>
            </form>
        </div>
    </body>
</html>
