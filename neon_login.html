<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Neon Login</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
                font-family: Arial, Helvetica, sans-serif;
                overflow: hidden;
            }

            body::before {
                content: "";
                position: absolute;
                width: 200%;
                height: 200%;
                background: repeating-linear-gradient(45deg, rgba(0, 255, 255, 0.08) 0px, rgba(0, 255, 255, 0.08) 2px, transparent 2px, transparent 10px);
                animation: moveGrid 10s linear infinite;
            }

            @keyframes moveGrid {
                from { transform: translate(0, 0); }
                to { transform: translate(-200px, -200px); }
            }

            .login-box {
                position: relative;
                width: 350px;
                padding: 40px 30px;
                background: rgba(0, 0, 0, 0.6,);
                border-radius: 20px;
                z-index: 1;
                box-shadow: 0 0 20px #00f2ff;
                border: 1px solid #00f2ff;
            }
            h1 {
                text-align: center;
                color: #00f2ff;
                margin-bottom: 30px;
                text-shadow: 0 0 10px #00f2ff;
            }

            label {
                color: #00eaff;
                font-size: 14px;
                margin-bottom: 5px;
                display: block;
                text-shadow: 0 0 5px #00ffff;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 20px;
                border-radius: 10px;
                border: 2px solid #00f2ff;
                background: #000;
                color: #00f9ff;
                font-size: 15px;
                outline: none;
                box-shadow: 0 0 10px #00f2ff;
            }

            input::placeholder {
                color: #00cdd6;
            }

            botton {
                width: 100%;
                padding: 12px;
                border-radius: 10px;
                border: 2px solid #00f2ff;
                background: black;
                color: #00f2ff;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 0 10px #00f2ff;
            }

            button:hover{
                background: #00f2ff;
                color: #000;
                box-shadow: 0 0 20px #00f2ff, 0 0 40px #00f2ff;
                transform: scale(1.05);
            }

            .login-box::before {
                content: "";
                position: absolute;
                inset: -2px;
                border-radius: 20px;
                background: linear-gradient(45deg, #00f2ff, #008cff, #00f2ff);
                filter: blur(20px);
                z-index: -1;
                animation: neonPulse 3s infinite alternate;
            }

            @keyframes neonPulse {
                from { opacity: 0.4; }
                to { opacity: 1; }
            }
            
        </style>
    </head>
    <body>
        <div class="login-box">
            <h1>Neon Login</h1>

            <form action="/login" method="POST">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </body>
</html>
